<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • PriceCheck</title><style>body{margin:0;background:#080b12;color:#f8fafc;font-family:system-ui}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.top{padding:28px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{padding:20px;border:1px solid #273449;border-radius:18px;background:#101827}.card b{font-size:24px}.btn{padding:10px 13px;border:1px solid #334155;border-radius:11px;background:#172033;color:white;cursor:pointer}a{color:#a78bfa;text-decoration:none}.warn{padding:15px;border-radius:14px;background:#422006;color:#fde68a;border:1px solid #78350f}.ok{padding:15px;border-radius:14px;background:#064e3b;color:#a7f3d0;border:1px solid #065f46}</style></head><body><main class="wrap"><header class="top"><div><small>PRICECHECK</small><h1>🛠️ Panneau de commande</h1></div><button class="btn" id="logout">Déconnexion</button></header><section id="state"></section><div class="grid"><div class="card">📦<br><b>Items</b><p>Gérer les fiches et caractéristiques.</p></div><div class="card">💰<br><b>Prix</b><p>Préparer les futures mises à jour des estimations.</p></div><div class="card">⚡<br><b>XP & POG</b><p>Gérer les données métiers et paliers.</p></div><div class="card">🎥<br><b>Médias</b><p>Surveiller les vidéos, streams et rediffusions.</p></div></div><p style="margin-top:24px"><a href="index.html">← Retour au PriceCheck</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>const c=window.PRICECHECK_AUTH||{};const state=document.querySelector('#state');let supa=null;if(c.supabaseUrl&&c.supabaseAnonKey&&window.supabase)supa=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);(async()=>{if(!supa){state.innerHTML='<div class="warn">⚠️ Supabase n’est pas encore configuré. Le panneau est installé mais l’accès sécurisé n’est pas activé.</div>';return}const {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}const email=(session.user.email||'').toLowerCase();const admins=(c.adminEmails||[]).map(x=>x.toLowerCase());if(!admins.includes(email)){state.innerHTML='<div class="warn">⛔ Accès refusé pour '+email+'.</div>';return}state.innerHTML='<div class="ok">✅ Connecté en tant qu’administrateur : '+email+'</div>'})();logout.onclick=async()=>{if(supa)await supa.auth.signOut();location.href='index.html'};</script></body></html>
