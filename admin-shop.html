<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d16">
<title>Admin Shop • Paladium PriceCheck</title>
<style>
:root{--bg:#080b12;--panel:#101827;--line:#273449;--text:#f8fafc;--muted:#94a3b8;--accent:#8b5cf6;--cyan:#22d3ee;--good:#34d399}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 0%,#8b5cf633,transparent 32%),radial-gradient(circle at 90% 20%,#22d3ee22,transparent 30%),var(--bg)}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.nav{position:sticky;top:0;z-index:10;background:#080b12e8;backdrop-filter:blur(16px);border-bottom:1px solid #1c2636}.nav-in{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--cyan));font-weight:1000}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{padding:9px 11px;border-radius:10px;text-decoration:none;color:#cbd5e1}.links a:hover{background:#172033;color:white}.hero{padding:46px 0 25px}.pill{display:inline-flex;padding:8px 12px;border:1px solid #8b5cf688;border-radius:999px;background:#8b5cf61a;color:#ddd6fe;font-size:12px;font-weight:800}.hero h1{font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-2px;margin:15px 0 10px}.hero p{max-width:760px;color:var(--muted);line-height:1.7}.tools{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:20px 0}.control{width:100%;padding:13px 14px;color:white;background:#0d1421;border:1px solid var(--line);border-radius:12px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px;padding-bottom:45px}.card{position:relative;padding:17px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#111a2a,#0d1420);overflow:hidden}.card:hover{border-color:#8b5cf688;box-shadow:0 14px 35px #0005}.top{display:flex;justify-content:space-between;gap:10px}.top img{width:68px;height:68px;object-fit:contain}.cat{display:inline-block;padding:5px 8px;border-radius:999px;background:#1c293b;color:#cbd5e1;font-size:10px;font-weight:800}.name{font-size:19px;font-weight:900;margin:10px 0 4px}.price{font-size:23px;font-weight:950;color:#c4b5fd}.muted{color:var(--muted);font-size:12px}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:700px){.tools{grid-template-columns:1fr}.nav-in{align-items:flex-start;padding:10px 0;flex-direction:column}}
</style></head>
<body>
<nav class="nav"><div class="wrap nav-in"><a class="brand" href="index.html"><div class="logo">P</div><div><b>PriceCheck</b><small style="display:block;color:#94a3b8">Paladium V12</small></div></a><div class="links"><a href="index.html">Catalogue</a><a href="changelog.html">Changelog</a><a href="wiki.html">Wiki</a><a href="commands.html">Commandes</a><a href="profile.html">Profil</a></div></div></nav>
<main class="wrap"><section class="hero"><span class="pill">🛒 PALADIUM</span><h1>Admin Shop</h1><p>Le catalogue de l’<b>Admin Shop</b> de Paladium. Cette section est publique et n’est pas un panneau réservé aux administrateurs.</p><div class="tools"><input class="control" id="search" placeholder="🔎 Rechercher un item…"><select class="control" id="category"><option value="">Toutes les catégories</option></select></div></section><section id="grid" class="grid"></section></main>
<script src="data.js"></script><script src="extra-items.js"></script>
<script>
(()=>{const all=[...(window.ITEMS||[]),...(window.EXTRA_ITEMS||[])];const unique=[...new Map(all.map(x=>{const name=Array.isArray(x)?x[0]:x.name;return [name,x]})).values()];const $=s=>document.querySelector(s);const grid=$('#grid');const cat=$('#category');const search=$('#search');function row(x){if(Array.isArray(x))return {name:x[0],category:x[2]||'Autre',image:x[4]||'',price:Number(x[5]||0)};return {name:x.name||'Item',category:x.category||'Autre',image:x.image||'',price:Number(x.price||0)}}const rows=unique.map(row);[...new Set(rows.map(x=>x.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});function render(){const q=search.value.trim().toLowerCase(),c=cat.value;const out=rows.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!c||x.category===c));grid.innerHTML=out.length?out.map(x=>`<article class="card"><div class="top"><div><span class="cat">${x.category}</span><div class="name">${x.name}</div></div>${x.image?`<img src="${x.image}" alt="">`:''}</div><div class="price">${x.price.toLocaleString('fr-FR')} P$</div><div class="muted">Prix catalogue PriceCheck</div></article>`).join(''):'<div class="empty">Aucun item trouvé.</div>'}search.addEventListener('input',render);cat.addEventListener('change',render);render()})();
</script></body></html>
