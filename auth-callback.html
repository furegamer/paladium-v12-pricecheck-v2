<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion • PriceCheck</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#f8fafc;font-family:system-ui,sans-serif}.box{width:min(430px,calc(100% - 36px));padding:28px;border:1px solid #273449;border-radius:20px;background:#101827;text-align:center}.spin{width:32px;height:32px;margin:0 auto 14px;border:3px solid #334155;border-top-color:#8b5cf6;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#94a3b8}a{color:#c4b5fd}</style></head><body><main class="box"><div class="spin"></div><h1>Connexion en cours…</h1><p id="msg">Récupération de ton compte Discord.</p><a id="back" href="login.html" hidden>Retour à la connexion</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>(async()=>{const msg=document.getElementById('msg'),back=document.getElementById('back');const cfg=window.PRICECHECK_AUTH||{};try{if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw new Error('Configuration Supabase manquante.');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error)throw error;}else if(location.hash){const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error_description'))throw new Error(hash.get('error_description'));}const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw new Error('La session Discord n’a pas pu être récupérée.');location.replace('index.html');}catch(e){msg.textContent='❌ '+(e?.message||'Connexion impossible.');back.hidden=false;document.querySelector('.spin').style.display='none';}})();</script></body></html>
