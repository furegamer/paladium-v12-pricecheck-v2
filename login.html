<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion • PriceCheck</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#f8fafc;font-family:system-ui}.box{width:min(420px,calc(100% - 32px));padding:28px;border:1px solid #273449;border-radius:20px;background:#101827;text-align:center;box-shadow:0 20px 60px #0006}button{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #334155;border-radius:12px;background:#172033;color:white;font-size:15px;cursor:pointer}.discord{background:#5865f2;border:0}.microsoft{background:#2563eb;border:0}small{color:#94a3b8}a{color:#a78bfa}</style></head><body><main class="box"><h1>🔐 Connexion</h1><p>Connecte-toi à PriceCheck avec ton compte.</p><button class="discord" id="discord">🎮 Continuer avec Discord</button><button class="microsoft" id="microsoft">▦ Continuer avec Microsoft</button><p id="msg"><small>Discord et Microsoft seront disponibles dès que les fournisseurs seront configurés dans Supabase.</small></p><p><a href="index.html">← Retour au PriceCheck</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>const c=window.PRICECHECK_AUTH||{};const ready=c.supabaseUrl&&c.supabaseAnonKey;const msg=document.querySelector('#msg');let supa=null;if(ready&&window.supabase)supa=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);async function login(provider){if(!supa){msg.innerHTML='<small>Configuration Supabase manquante. Ajoute supabaseUrl et supabaseAnonKey dans auth-config.js.</small>';return}msg.innerHTML='<small>Ouverture de la connexion…</small>';const r=await supa.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname.replace('login.html','admin.html')}});if(r.error)msg.textContent=r.error.message}discord.onclick=()=>login('discord');microsoft.onclick=()=>login('azure');</script></body></html>
