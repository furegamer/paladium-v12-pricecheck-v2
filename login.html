<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion • Paladium PriceCheck</title>
<style>
:root{--bg:#080b12;--panel:#101827;--line:#273449;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#8b5cf633,transparent 35%),radial-gradient(circle at 80% 30%,#22d3ee22,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:22px;background:var(--panel);text-align:center;box-shadow:0 20px 70px #0008}.logo{width:54px;height:54px;margin:auto;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);font-weight:900;font-size:24px}.version{display:inline-block;margin:15px 0 8px;padding:6px 10px;border:1px solid #8b5cf688;border-radius:99px;background:#8b5cf61a;color:#ddd6fe;font-size:11px;font-weight:800}.muted{color:var(--muted);line-height:1.6}.discord,.switch{position:relative;isolation:isolate;overflow:hidden;width:100%;margin:18px 0 8px;padding:14px;border:0;border-radius:13px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.discord{background:#5865f2;box-shadow:0 0 0 0 #5865f244;animation:loginPulse 1.8s ease-in-out infinite}.switch{margin-top:4px;background:#202b3d;border:1px solid #35445c;color:#e2e8f0;animation:none}.discord:hover,.switch:hover{filter:brightness(1.08)}.discord:disabled,.switch:disabled{opacity:.65;cursor:wait}.back{color:#c4b5fd;text-decoration:none;font-size:13px;display:inline-block;margin-top:8px}#msg{min-height:22px;font-size:13px}@keyframes loginPulse{0%,100%{box-shadow:0 0 0 0 #5865f244}50%{box-shadow:0 0 0 7px #5865f20f}}
</style>
</head>
<body>
<main class="box">
<div class="logo">P</div>
<div class="version">🚀 PRICECHECK</div>
<h1>🔐 Connexion</h1>
<p class="muted">Connecte ton propre compte Discord pour retrouver ton profil, ton portefeuille, tes métiers et tes favoris.</p>
<button class="discord" id="discord">🎮 Continuer avec Discord</button>
<button class="switch" id="switchAccount">🔄 Changer de compte Discord</button>
<p id="msg" class="muted">Connexion sécurisée via Supabase Auth.</p>
<a class="back" href="index.html">← Retour au PriceCheck</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script>
const cfg=window.PRICECHECK_AUTH||{};
const msg=document.getElementById('msg');
const loginBtn=document.getElementById('discord');
const switchBtn=document.getElementById('switchAccount');
let client=null;
if(window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey){client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey)}
function setBusy(text){msg.textContent=text;loginBtn.disabled=true;switchBtn.disabled=true}
function unlock(){loginBtn.disabled=false;switchBtn.disabled=false}
async function startDiscord(changeAccount=false){
  if(!client){msg.textContent='⚠️ Configuration Supabase manquante.';return}
  setBusy(changeAccount?'Déconnexion du compte actuel…':'Ouverture de Discord…');
  try{
    if(changeAccount){
      const {error:signOutError}=await client.auth.signOut({scope:'local'});
      if(signOutError)throw signOutError;
      msg.textContent='Compte local déconnecté. Choisis maintenant le compte Discord à utiliser…';
      await new Promise(r=>setTimeout(r,250));
    }
    const redirect=cfg.loginRedirect||new URL('index.html',location.href).href;
    const {error}=await client.auth.signInWithOAuth({
      provider:'discord',
      options:{redirectTo:redirect,queryParams:{prompt:changeAccount?'login':'consent'}}
    });
    if(error)throw error;
  }catch(error){
    msg.textContent='❌ '+(error?.message||'Impossible de lancer la connexion.');
    unlock();
  }
}
loginBtn.addEventListener('click',()=>startDiscord(false));
switchBtn.addEventListener('click',()=>startDiscord(true));
</script>
</body>
</html>
