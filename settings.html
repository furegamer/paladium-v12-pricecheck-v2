<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réglages • PriceCheck V12</title><style>body{margin:0;background:#090613;color:#f7f3ff;font-family:Inter,system-ui,sans-serif}main{max-width:850px;margin:auto;padding:40px 20px}.card{background:#100b1d;border:1px solid #2b1d43;border-radius:16px;padding:20px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #2b1d43}.row:last-child{border:0}button{padding:9px 13px;border:1px solid #3a2852;border-radius:10px;background:#171024;color:#fff}input[type=range]{width:180px}a{color:#c49aff}.back{display:inline-block;padding:10px 14px;border:1px solid #3a2852;border-radius:10px;text-decoration:none}</style></head><body><main><a class="back" href="index.html">← PriceCheck</a><h1>⚙️ Réglages</h1><div class="card"><div class="row"><span>🔊 Effets sonores</span><button id="sfx">Activés</button></div><div class="row"><span>🎵 Musique d’ambiance</span><button id="music">Désactivée</button></div><div class="row"><span>Volume</span><input id="vol" type="range" min="0" max="100" value="30"></div></div><div class="card"><h2>🎧 Audio</h2><p>Les préférences sont enregistrées sur cet appareil. La musique intégrée est une ambiance synthétique générée par le navigateur, sans fichier musical externe.</p></div></main><script>const S='pricecheck:settings';let p=JSON.parse(localStorage.getItem(S)||'{}');let sfx=p.sfx!==false,music=p.music===true,vol=p.vol??30;const save=()=>localStorage.setItem(S,JSON.stringify({sfx,music,vol}));const update=()=>{document.querySelector('#sfx').textContent=sfx?'Activés':'Désactivés';document.querySelector('#music').textContent=music?'Activée':'Désactivée';document.querySelector('#vol').value=vol};document.querySelector('#sfx').onclick=()=>{sfx=!sfx;save();update()};document.querySelector('#music').onclick=()=>{music=!music;save();update()};document.querySelector('#vol').oninput=e=>{vol=+e.target.value;save()};update();</script></body></html>
