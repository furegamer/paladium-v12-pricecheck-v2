<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#080b12"
>

<title>
Item • Paladium V12 PriceCheck
</title>


<style>

:root{

    --bg:#080b12;
    --card:#111827;
    --border:#29354a;
    --text:#f8fafc;
    --muted:#94a3b8;

    --purple:#8b5cf6;
    --cyan:#22d3ee;

    --green:#34d399;
    --red:#fb7185;

}

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    color:var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            circle at 20% 10%,
            rgba(139,92,246,.30),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 40%,
            rgba(34,211,238,.20),
            transparent 35%
        ),

        #080b12;

}


.container{

    width:
        min(
            900px,
            calc(100% - 30px)
        );

    margin:auto;

    padding:
        25px 0 60px;

}


.back{

    display:inline-block;

    margin-bottom:20px;

    padding:
        10px 14px;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    background:#111827;

    color:#c4b5fd;

    text-decoration:none;

    font-size:14px;

    transition:.2s;

}


.back:hover{

    border-color:var(--purple);

    transform:translateY(-2px);

}


.item-header{

    padding:28px;

    border:
        1px solid
        var(--border);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #151c2c,
            #0d131e
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

}


/* IMAGE */

.detail-image{

    width:
        min(
            150px,
            40vw
        );

    height:
        min(
            150px,
            40vw
        );

    object-fit:contain;

    display:block;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 10px 20px
            rgba(0,0,0,.4)
        );

}


/* CATEGORY */

.category{

    display:inline-block;

    padding:
        6px 10px;

    border-radius:99px;

    background:#202b3d;

    color:#cbd5e1;

    font-size:11px;

    font-weight:700;

}


/* TITLE */

h1{

    margin:
        13px 0 8px;

    font-size:
        clamp(
            34px,
            8vw,
            55px
        );

    line-height:1;

}


.description{

    color:var(--muted);

    line-height:1.6;

    max-width:700px;

}


/* RARETÉS */

.rarity{

    display:inline-block;

    margin-top:13px;

    padding:
        7px 11px;

    border-radius:999px;

    font-size:11px;

    font-weight:800;

    text-transform:uppercase;

}


.rarity-common{

    background:#374151;
    color:#e5e7eb;

}


.rarity-uncommon{

    background:#14532d;
    color:#86efac;

}


.rarity-rare{

    background:#1e3a8a;
    color:#93c5fd;

}


.rarity-epic{

    background:#581c87;
    color:#d8b4fe;

}


.rarity-legendary{

    background:#78350f;
    color:#fcd34d;

}


.rarity-unique{

    background:#7f1d1d;
    color:#fca5a5;

}


/* SECTION */

.section{

    margin-top:32px;

}


.section h2{

    font-size:25px;

    margin-bottom:14px;

}


/* PRIX */

.price-box{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:12px;

}


.price{

    padding:20px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:var(--card);

}


.price span{

    display:block;

    color:var(--muted);

    font-size:12px;

}


.price strong{

    display:block;

    margin-top:7px;

    font-size:23px;

}


/* INFOS */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                180px,
                1fr
            )
        );

    gap:12px;

}


.info{

    padding:17px;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:var(--card);

}


.info span{

    display:block;

    color:var(--muted);

    font-size:12px;

}


.info strong{

    display:block;

    margin-top:7px;

    font-size:18px;

}


/* ALIAS */

.alias-box{

    margin-top:25px;

    padding:18px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:#0d131f;

}


.alias{

    display:inline-block;

    margin:
        8px 5px 0 0;

    padding:
        7px 10px;

    border-radius:9px;

    background:#202b3d;

    color:#cbd5e1;

    font-size:12px;

}


/* NOT FOUND */

.not-found{

    text-align:center;

    padding:
        60px 20px;

}


.not-found-icon{

    font-size:60px;

}


.not-found h1{

    font-size:38px;

}


/* MOBILE */

@media(max-width:600px){

    .container{

        padding-top:15px;

    }


    .item-header{

        padding:20px;

    }


    .price-box{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>

/* ==================================================
   RARETÉ
================================================== */

function getRarityClass(rarity){

    switch(rarity){

        case "Peu commun":
            return "rarity-uncommon";

        case "Rare":
            return "rarity-rare";

        case "Épique":
            return "rarity-epic";

        case "Légendaire":
            return "rarity-legendary";

        case "Unique":
            return "rarity-unique";

        default:
            return "rarity-common";

    }

}


/* ==================================================
   PRIX
================================================== */

function money(value){

    if(value === 0){

        return "À déterminer";

    }

    return value.toLocaleString("fr-FR")
        + " $";

}


/* ==================================================
   NORMALISATION
================================================== */

function normalize(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


/* ==================================================
   RÉCUPÉRER URL
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const requested =
    params.get("item");


const normalizedRequested =
    normalize(requested);


/* ==================================================
   TROUVER ITEM
================================================== */

const item =
    items.find(x => {

        const normalizedName =
            normalize(x.name);


        const slug =
            normalizedName
            .replace(/\s+/g,"-");


        const aliases =
            (x.aliases || [])
            .map(alias =>
                normalize(alias)
            );


        return (

            normalizedRequested ===
            normalizedName

            ||

            normalizedRequested ===
            slug

            ||

            aliases.includes(
                normalizedRequested
            )

        );

    });


/* ==================================================
   CONTAINER
================================================== */

const container =
    document.getElementById("item");


/* ==================================================
   ITEM INTROUVABLE
================================================== */

}


/* ==================================================
   AFFICHAGE ITEM
================================================== */
