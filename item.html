<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#080b12">

<title>Item • Paladium PriceCheck</title>

<style>

:root{
    --bg:#080b12;
    --card:#111827;
    --border:#29354a;
    --text:#f8fafc;
    --muted:#94a3b8;
    --purple:#8b5cf6;
    --cyan:#22d3ee;
    --green:#34d399;
    --red:#fb7185;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:

        radial-gradient(
            circle at 20% 10%,
            rgba(139,92,246,.30),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 40%,
            rgba(34,211,238,.20),
            transparent 35%
        ),

        #080b12;

    color:var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}

.container{

    width:
        min(
            900px,
            calc(100% - 30px)
        );

    margin:auto;

    padding:
        25px 0 60px;

}

.back{

    display:inline-block;

    margin-bottom:25px;

    color:#c4b5fd;

    text-decoration:none;

    font-size:14px;

}

.item-header{

    padding:25px;

    border:
        1px solid
        var(--border);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #151c2c,
            #0d131e
        );

}

.icon{

    font-size:70px;

}

.category{

    display:inline-block;

    margin-top:10px;

    padding:6px 10px;

    border-radius:99px;

    background:#202b3d;

    color:#cbd5e1;

    font-size:11px;

}

h1{

    margin:
        12px 0 5px;

    font-size:
        clamp(
            34px,
            8vw,
            55px
        );

}

.description{

    color:var(--muted);

}

.rarity{

    display:inline-block;

    margin-top:12px;

    padding:7px 11px;

    border-radius:999px;

    background:#581c87;

    color:#e9d5ff;

    font-size:11px;

    font-weight:800;

}


/* PRIX */

.price-box{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:12px;

    margin-top:15px;

}

.price{

    padding:18px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:var(--card);

}

.price span{

    display:block;

    color:var(--muted);

    font-size:12px;

}

.price strong{

    display:block;

    margin-top:7px;

    font-size:23px;

}


/* INFOS */

.section{

    margin-top:35px;

}

.section h2{

    font-size:25px;

}

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                180px,
                1fr
            )
        );

    gap:12px;

}

.info{

    padding:16px;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:var(--card);

}

.info span{

    display:block;

    color:var(--muted);

    font-size:12px;

}

.info strong{

    display:block;

    margin-top:7px;

    font-size:18px;

}


/* RESPONSIVE */

@media(max-width:600px){

    .price-box{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>

<div class="container">


<a
href="index.html"
class="back"
>
← Retour au PriceCheck
</a>


<div
id="item"
class="item-header"
>

Chargement...


</div>


</div>


<script>


/*
================================
BASE DES ITEMS
================================
*/

const items = [

{
name:"Pickaxe of the God",
aliases:["Pog","POG","Pickaxe of God"],
category:"Outils",
rarity:"Unique",
icon:"⛏️",

price:0,
min:0,
max:0,

change:"—",

damage:"—",

durability:"—",

speed:"—",

level:"—",

material:"Paladium",

description:
"La célèbre Pickaxe of the God. Les informations de prix et de statistiques peuvent être complétées avec les données V12 vérifiées."

},

{
name:"Paladium",
aliases:["Pala"],
category:"Minerais",
rarity:"Légendaire",
icon:"💜",

price:1200,
min:900,
max:1600,

change:"+8%",

damage:"—",

durability:"—",

speed:"—",

level:"—",

material:"Minerai",

description:
"Minerai précieux utilisé dans différents crafts et équipements."
},

{
name:"Titane",
aliases:["Titanium"],
category:"Minerais",
rarity:"Épique",
icon:"🔷",

price:850,
min:650,
max:1100,

change:"+3%",

damage:"—",

durability:"—",

speed:"—",

level:"—",

material:"Minerai",

description:
"Ressource minérale rare."
},

{
name:"Améthyste",
aliases:["Ame","Amé"],
category:"Minerais",
rarity:"Rare",
icon:"💎",

price:500,
min:350,
max:700,

change:"-4%",

damage:"—",

durability:"—",

speed:"—",

level:"—",

material:"Minerai",

description:
"Minerai utilisé dans différents crafts."
},

{
name:"Pioche Paladium",
aliases:["Pioche Pala"],
category:"Outils",
rarity:"Légendaire",
icon:"⛏️",

price:18000,
min:13000,
max:25000,

change:"+7%",

damage:"—",

durability:"—",

speed:"—",

level:"—",

material:"Paladium",

description:
"Pioche avancée destinée au minage."
}

];


/*
================================
RÉCUPÉRER L'ITEM DANS L'URL
================================
*/

const params =
new URLSearchParams(
window.location.search
);

const requested =
params
.get("item");


/*
================================
CHERCHER L'ITEM
================================
*/

const item =
items.find(
x =>

x.name
.toLowerCase()
.replaceAll(" ","-")
=== requested

);


/*
================================
AFFICHER
================================
*/

const container =
document.getElementById("item");


if(!item){

container.innerHTML = `

<h1>
❌ Item introuvable
</h1>

<p class="description">

Cet item n'existe pas encore
dans la base de données.

</p>

`;

}else{


const money =
value =>

value === 0
? "À déterminer"
: value.toLocaleString("fr-FR")+" $";


container.innerHTML = `

<div class="icon">
${item.icon}
</div>

<div class="category">
${item.category}
</div>

<h1>
${item.name}
</h1>

<div class="description">
${item.description}
</div>

<div class="rarity">
⭐ ${item.rarity}
</div>


<div class="price-box">

<div class="price">

<span>
Prix moyen
</span>

<strong>
${money(item.price)}
</strong>

</div>


<div class="price">

<span>
Prix minimum
</span>

<strong>
${money(item.min)}
</strong>

</div>


<div class="price">

<span>
Prix maximum
</span>

<strong>
${money(item.max)}
</strong>

</div>

</div>


<div class="section">

<h2>
📊 Informations
</h2>

<div class="info-grid">


<div class="info">

<span>
⚔️ Dégâts
</span>

<strong>
${item.damage}
</strong>

</div>


<div class="info">

<span>
⛏️ Durabilité
</span>

<strong>
${item.durability}
</strong>

</div>


<div class="info">

<span>
⚡ Vitesse
</span>

<strong>
${item.speed}
</strong>

</div>


<div class="info">

<span>
⭐ Niveau
</span>

<strong>
${item.level}
</strong>

</div>


<div class="info">

<span>
🧱 Matériau
</span>

<strong>
${item.material}
</strong>

</div>


<div class="info">

<span>
📈 Variation
</span>

<strong>
${item.change}
</strong>

</div>


</div>

</div>

`;

}

</script>

</body>

</html>
