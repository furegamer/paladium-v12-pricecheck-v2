<style>

:root{
    --bg:#080b12;
    --card:#111827;
    --border:#29354a;
    --text:#f8fafc;
    --muted:#94a3b8;
    --purple:#8b5cf6;
    --cyan:#22d3ee;
    --green:#34d399;
    --red:#fb7185;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    background:
        radial-gradient(circle at 20% 10%,rgba(139,92,246,.30),transparent 35%),
        radial-gradient(circle at 80% 40%,rgba(34,211,238,.20),transparent 35%),
        #080b12;
}

.container{
    width:min(900px,calc(100% - 30px));
    margin:auto;
    padding:25px 0 60px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 14px;

    border:1px solid var(--border);
    border-radius:12px;

    background:#111827;
    color:#c4b5fd;

    text-decoration:none;
    font-size:14px;

    transition:.2s;
}

.back:hover{
    border-color:var(--purple);
    transform:translateY(-2px);
}

.item-header{
    padding:28px;

    border:1px solid var(--border);
    border-radius:22px;

    background:linear-gradient(145deg,#151c2c,#0d131e);

    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.item-image{
    display:block;
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

.category{
    display:inline-block;
    padding:6px 10px;

    border-radius:99px;

    background:#202b3d;
    color:#cbd5e1;

    font-size:11px;
    font-weight:700;
}

h1{
    margin:13px 0 8px;
    font-size:clamp(34px,8vw,55px);
    line-height:1;
}

.description{
    color:var(--muted);
    line-height:1.6;
    max-width:700px;
}

.rarity{
    display:inline-block;
    margin-top:13px;
    padding:7px 11px;

    border-radius:999px;

    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.rarity-common{
    background:#374151;
    color:#e5e7eb;
}

.rarity-uncommon{
    background:#14532d;
    color:#86efac;
}

.rarity-rare{
    background:#1e3a8a;
    color:#93c5fd;
}

.rarity-epic{
    background:#581c87;
    color:#d8b4fe;
}

.rarity-legendary{
    background:#78350f;
    color:#fcd34d;
}

.rarity-unique{
    background:#7f1d1d;
    color:#fca5a5;
}

.section{
    margin-top:32px;
}

.section h2{
    font-size:25px;
    margin-bottom:14px;
}

.price-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.price{
    padding:20px;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);
}

.price span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

.price strong{
    display:block;
    margin-top:7px;
    font-size:23px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.info{
    padding:17px;

    border:1px solid var(--border);
    border-radius:15px;

    background:var(--card);
}

.info span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

.info strong{
    display:block;
    margin-top:7px;
    font-size:18px;
}

.alias-box{
    margin-top:25px;
    padding:18px;

    border:1px solid var(--border);
    border-radius:16px;

    background:#0d131f;
}

.alias{
    display:inline-block;

    margin:8px 5px 0 0;
    padding:7px 10px;

    border-radius:9px;

    background:#202b3d;
    color:#cbd5e1;

    font-size:12px;
}

.not-found{
    text-align:center;
    padding:60px 20px;
}

.not-found-image{
    width:100px;
    height:100px;
    object-fit:contain;
    margin:auto;
}

.not-found h1{
    font-size:38px;
}

@media(max-width:600px){

    .container{
        padding-top:15px;
    }

    .item-header{
        padding:20px;
    }

    .price-box{
        grid-template-columns:1fr;
    }

}

</style>

</head>

function normalize(value){

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

function slug(value){

    return normalize(value)
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");
}

function money(value){

    if(value === 0){
        return "À déterminer";
    }

    return value.toLocaleString("fr-FR") + " $";
}

function getRarityClass(rarity){

    switch(rarity){

        case "Peu commun":
            return "rarity-uncommon";

        case "Rare":
            return "rarity-rare";

        case "Épique":
            return "rarity-epic";

        case "Légendaire":
            return "rarity-legendary";

        case "Unique":
            return "rarity-unique";

        default:
            return "rarity-common";
    }
}

const params =
    new URLSearchParams(window.location.search);

const requested =
    params.get("item");

const normalizedRequested =
    normalize(requested);

const item =
    items.find(x => {

        const normalizedName =
            normalize(x.name);

        const normalizedSlug =
            slug(x.name);

        const aliasMatch =
            x.aliases.some(alias =>
                normalize(alias) === normalizedRequested
            );

        return (
            normalizedRequested === normalizedName ||
            normalizedRequested === normalizedSlug ||
            aliasMatch
        );
    });

const container =
    document.getElementById("item");

if(!item){

    container.innerHTML = `

        <div class="not-found">

            <img
                class="not-found-image"
                src="images/default.png"

            </p>

    `;
