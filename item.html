function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/[-_]/g," ").replace(/\s+/g," ").trim()}
function slug(v){return normalize(v).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function money(v){return v===0?"À déterminer":v.toLocaleString("fr-FR")+" $"}
function rarityClass(r){return {"Peu commun":"rarity-uncommon",Rare:"rarity-rare","Épique":"rarity-epic","Légendaire":"rarity-legendary",Unique:"rarity-unique"}[r]||"rarity-common"}
const wanted=normalize(new URLSearchParams(location.search).get("item")||"");const found=items.find(x=>normalize(x.name)===wanted||slug(x.name)===wanted||x.aliases.some(a=>normalize(a)===wanted));const box=document.getElementById("item");
if(!found){box.className="not-found";box.innerHTML='<img src="images/default.png" alt="Item introuvable" onerror="this.style.display=\'none\'"><h1>❌ Item introuvable</h1><p class="description">L’item demandé n’existe pas dans la base actuelle.</p>'}else{box.innerHTML=`<img class="item-image" src="${found.image}" alt="${found.name}" onerror="this.onerror=null;this.src='images/default.png'"><span class="category">${found.category}</span><h1>${found.name}</h1><p class="description">${found.description}</p><span class="rarity ${rarityClass(found.rarity)}">${found.rarity}</span>`;box.insertAdjacentHTML("beforeend",`<section class="section"><h2>📊 Caractéristiques</h2><div class="grid"><div class="box"><span>Niveau</span><strong>${found.level?found.level+" / 20":"Non renseigné"}</strong></div><div class="box"><span>Durabilité</span><strong>${found.durability!==undefined?found.durability:"—"}</strong></div><div class="box"><span>Dégâts outil</span><strong>${found.damage||"—"}</strong></div></div></section>`);box.insertAdjacentHTML("beforeend",`<section class="section"><h2>💰 Prix</h2><div class="grid"><div class="box"><span>Prix indicatif</span><strong>${money(found.price)}</strong></div><div class="box"><span>Minimum</span><strong>${found.min.toLocaleString("fr-FR")} $</strong></div><div class="box"><span>Maximum</span><strong>${found.max.toLocaleString("fr-FR")} $</strong></div></div></section>`);box.insertAdjacentHTML("beforeend",`<section class="section"><h2>🛠️ Craft</h2><div class="craft">${found.craft}<ul class="craft-list"><li>Les recettes marquées « à confirmer » ne sont pas inventées : elles attendent une source officielle précise.</li><li>Pour un craft multi-étapes, la fiche pourra être enrichie avec chaque composant.</li></ul></div></section>`);box.insertAdjacentHTML("beforeend",`<section class="section"><div class="aliases"><strong>🔎 Alias de recherche</strong><div>${found.aliases.map(a=>`<span class="alias">${a}</span>`).join("")}</div></div></section>`)}
