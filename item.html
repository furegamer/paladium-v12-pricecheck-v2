<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080b12"><title>Item • Paladium V12 PriceCheck</title><style>:root{--card:#111827;--border:#29354a;--text:#f8fafc;--muted:#94a3b8;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,rgba(139,92,246,.3),transparent 35%),radial-gradient(circle at 80% 40%,rgba(34,211,238,.2),transparent 35%),#080b12}.container{width:min(900px,calc(100% - 30px));margin:auto;padding:25px 0 60px}.back{display:inline-block;margin-bottom:20px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:#111827;color:#c4b5fd;text-decoration:none;font-size:14px}.item-header{padding:28px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,#151c2c,#0d131e)}.item-image{display:block;width:120px;height:120px;object-fit:contain;margin-bottom:15px}.category{display:inline-block;padding:6px 10px;border-radius:99px;background:#202b3d;color:#cbd5e1;font-size:11px}h1{margin:13px 0 8px;font-size:clamp(34px,8vw,55px);line-height:1}.description{color:var(--muted);line-height:1.6}.rarity{display:inline-block;margin-top:13px;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}.rarity-common{background:#374151;color:#e5e7eb}.rarity-uncommon{background:#14532d;color:#86efac}.rarity-rare{background:#1e3a8a;color:#93c5fd}.rarity-epic{background:#581c87;color:#d8b4fe}.rarity-legendary{background:#78350f;color:#fcd34d}.rarity-unique{background:#7f1d1d;color:#fca5a5}.section{margin-top:32px}.price-box,.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--card)}.box span{display:block;color:var(--muted);font-size:12px}.box strong{display:block;margin-top:7px;font-size:23px}.info-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.aliases{padding:18px;border:1px solid var(--border);border-radius:16px;background:#0d131f}.alias{display:inline-block;margin:8px 5px 0 0;padding:7px 10px;border-radius:9px;background:#202b3d;color:#cbd5e1;font-size:12px}.not-found{text-align:center;padding:60px 20px}.not-found img{width:100px;height:100px;object-fit:contain}@media(max-width:600px){.price-box{grid-template-columns:1fr}.item-header{padding:20px}}</style></head><body><div class="container"><a href="index.html" class="back" id="backButton">← Retour au PriceCheck</a><div id="item" class="item-header">Chargement...</div></div><script>
const items=[
{name:"Pickaxe of the God",aliases:["Pog","POG","Pickaxe of God"],category:"Outils",rarity:"Unique",image:"images/pog.png",price:0,min:0,max:0,change:"—",description:"La célèbre Pickaxe of the God, souvent appelée POG."},
{name:"Paladium",aliases:["Pala"],category:"Minerais",rarity:"Légendaire",image:"images/paladium.png",price:1200,min:900,max:1600,change:"+8%",description:"Un minerai précieux utilisé dans différents crafts."},
{name:"Titane",aliases:["Titanium"],category:"Minerais",rarity:"Épique",image:"images/titane.png",price:850,min:650,max:1100,change:"+3%",description:"Une ressource minérale importante pour la progression."},
{name:"Améthyste",aliases:["Ame","Amé"],category:"Minerais",rarity:"Rare",image:"images/amethyste.png",price:500,min:350,max:700,change:"-4%",description:"Une ressource minérale rare."},
{name:"Rubis",aliases:["Ruby"],category:"Minerais",rarity:"Rare",image:"images/rubis.png",price:700,min:500,max:900,change:"+6%",description:"Un minerai précieux de couleur rouge."},
{name:"Saphir",aliases:["Saph"],category:"Minerais",rarity:"Rare",image:"images/saphir.png",price:650,min:450,max:850,change:"-2%",description:"Une ressource minérale bleue."},
{name:"Émeraude",aliases:["Emerald","Emer"],category:"Minerais",rarity:"Peu commun",image:"images/emeraude.png",price:450,min:300,max:650,change:"+5%",description:"Une ressource verte utilisée dans plusieurs crafts."},
{name:"Obsidienne",aliases:["Obsi"],category:"Ressources",rarity:"Peu commun",image:"images/obsidienne.png",price:180,min:120,max:250,change:"+2%",description:"Une ressource sombre et résistante."},
{name:"Perle de l'End",aliases:["Perle","Ender Pearl"],category:"Ressources",rarity:"Rare",image:"images/perle-end.png",price:900,min:650,max:1200,change:"+6%",description:"Une perle mystérieuse provenant de l'End."},
{name:"Machine industrielle",aliases:["Machine"],category:"Machines",rarity:"Épique",image:"images/machine.png",price:25000,min:18000,max:35000,change:"+10%",description:"Une machine destinée à automatiser certaines productions."},
{name:"Four amélioré",aliases:["Four"],category:"Machines",rarity:"Rare",image:"images/four.png",price:9000,min:7000,max:12000,change:"+1%",description:"Un four amélioré permettant une production plus efficace."},
{name:"Pioche Paladium",aliases:["Pioche Pala"],category:"Outils",rarity:"Légendaire",image:"images/pioche-paladium.png",price:18000,min:13000,max:25000,change:"+7%",description:"Une pioche fabriquée à partir de Paladium."},
{name:"Épée Paladium",aliases:["Épée Pala"],category:"Outils",rarity:"Légendaire",image:"images/epee-paladium.png",price:22000,min:16000,max:30000,change:"+4%",description:"Une épée puissante fabriquée à partir de Paladium."},
{name:"Casque Paladium",aliases:["Casque Pala"],category:"Armures",rarity:"Légendaire",image:"images/casque-paladium.png",price:16000,min:12000,max:22000,change:"-1%",description:"Un casque d'armure en Paladium."},
{name:"Plastron Paladium",aliases:["Plastron Pala"],category:"Armures",rarity:"Légendaire",image:"images/plastron-paladium.png",price:30000,min:24000,max:40000,change:"+9%",description:"Un plastron puissant en Paladium."},
{name:"Pomme dorée",aliases:["Pomme","Golden Apple"],category:"Nourriture",rarity:"Rare",image:"images/pomme-doree.png",price:2500,min:1800,max:3500,change:"+2%",description:"Une nourriture précieuse aux propriétés spéciales."},
{name:"Pain",aliases:["Bread"],category:"Nourriture",rarity:"Commun",image:"images/pain.png",price:80,min:50,max:120,change:"-3%",description:"Un aliment simple et accessible."}
];
function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/[-_]/g," ").replace(/\s+/g," ").trim()}
function slug(v){return normalize(v).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function money(v){return v===0?"À déterminer":v.toLocaleString("fr-FR")+" $"}
function rarityClass(r){return {"Peu commun":"rarity-uncommon",Rare:"rarity-rare","Épique":"rarity-epic","Légendaire":"rarity-legendary",Unique:"rarity-unique"}[r]||"rarity-common"}
const wanted=normalize(new URLSearchParams(location.search).get("item")||"");
const found=items.find(x=>normalize(x.name)===wanted||slug(x.name)===wanted||x.aliases.some(a=>normalize(a)===wanted));
const box=document.getElementById("item");
if(!found){box.className="not-found";box.innerHTML='<img src="images/default.png" alt="Item introuvable" onerror="this.style.display=\'none\'"><h1>❌ Item introuvable</h1><p class="description">L’item demandé n’existe pas dans la base actuelle.</p>'}else{box.innerHTML=`<img class="item-image" src="${found.image}" alt="${found.name}" onerror="this.onerror=null;this.src='images/default.png'"><span class="category">${found.category}</span><h1>${found.name}</h1><p class="description">${found.description}</p><span class="rarity ${rarityClass(found.rarity)}">${found.rarity}</span>`;box.insertAdjacentHTML("beforeend",`<section class="section"><h2>💰 Prix</h2><div class="price-box"><div class="box"><span>Prix indicatif</span><strong>${money(found.price)}</strong></div><div class="box"><span>Minimum</span><strong>${found.min.toLocaleString("fr-FR")} $</strong></div><div class="box"><span>Maximum</span><strong>${found.max.toLocaleString("fr-FR")} $</strong></div></div></section>`);box.insertAdjacentHTML("beforeend",`<section class="section"><h2>📊 Informations</h2><div class="info-grid"><div class="box"><span>Catégorie</span><strong>${found.category}</strong></div><div class="box"><span>Rareté</span><strong>${found.rarity}</strong></div><div class="box"><span>Évolution</span><strong>${found.change}</strong></div></div></section>`);box.insertAdjacentHTML("beforeend",`<section class="section"><div class="aliases"><strong>🔎 Alias de recherche</strong><div>${found.aliases.map(a=>`<span class="alias">${a}</span>`).join("")}</div></div></section>`)}
document.getElementById("backButton").addEventListener("click",e=>{e.preventDefault();location.href="index.html"});
</script></body></html>
