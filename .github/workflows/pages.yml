name: Deploy PriceCheck

on:
  push:
    branches:
      - '(root)'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}

jobs:
  check:
    name: Check PriceCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site structure and assets
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html item.html item.js app.js data.js changelog.html robots.txt sitemap.xml)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          test -d images
          echo "Checking referenced image files..."
          refs=$(grep -rhoE "images/[A-Za-z0-9._-]+\.(svg|png|jpg|jpeg|webp)" --include='*.js' --include='*.html' . | sort -u || true)
          if [ -n "$refs" ]; then
            while read -r asset; do
              test -f "$asset" || { echo "Missing image: $asset"; exit 1; }
              size=$(wc -c < "$asset")
              if [ "$size" -lt 20 ]; then echo "Invalid/empty image: $asset (${size} bytes)"; exit 1; fi
              case "$asset" in
                *.svg) grep -q '<svg' "$asset" || { echo "Invalid SVG: $asset"; exit 1; } ;;
                *.png|*.jpg|*.jpeg|*.webp) file "$asset" | grep -Eiq 'image|bitmap' || { echo "Invalid raster image: $asset"; exit 1; } ;;
              esac
            done <<< "$refs"
          fi
          echo "Checking internal HTML links..."
          grep -rhoE 'href="[A-Za-z0-9._/-]+\.html"' --include='*.html' . | sed -E 's/^href="//;s/"$//' | sort -u | while read -r page; do
            test -f "$page" || { echo "Missing linked page: $page"; exit 1; }
          done
          echo "PriceCheck validation passed"

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
