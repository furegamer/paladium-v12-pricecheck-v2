name: Deploy PriceCheck

on:
  push:
    branches:
      - '(root)'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check:
    name: Check PriceCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify site structure and assets
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html item.html item.js app.js data.js changelog.html robots.txt sitemap.xml)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "ERROR: missing required file: $file"; exit 1; }
          done
          test -d images || { echo "ERROR: missing images directory"; exit 1; }
          refs="$(grep -rhoE 'images/[A-Za-z0-9._-]+\.(svg|png|jpg|jpeg|webp)' --include='*.js' --include='*.html' --exclude-dir=.git . 2>/dev/null | sort -u || true)"
          if [ -n "$refs" ]; then
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              test -f "$asset" || { echo "ERROR: missing image: $asset"; exit 1; }
              case "$asset" in
                *.svg) grep -qi '<svg' "$asset" || { echo "ERROR: invalid SVG: $asset"; exit 1; } ;;
              esac
            done <<< "$refs"
          fi
          for js in *.js; do
            [ -f "$js" ] || continue
            node --check "$js" || { echo "ERROR: JavaScript syntax error: $js"; exit 1; }
          done
          echo "PriceCheck validation passed"

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
