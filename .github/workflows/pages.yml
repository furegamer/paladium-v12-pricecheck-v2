name: Deploy PriceCheck

on:
  push:
    branches:
      - '(root)'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check PriceCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f item.html
          test -f item.js
          test -f app.js
          test -f data.js
          test -f changelog.html
          test -d images

          echo "Checking image references from data.js..."
          grep -oE "images/[A-Za-z0-9._-]+\\.(svg|png|jpg|jpeg|webp)" data.js | sort -u | while read -r asset; do
            test -f "$asset" || { echo "Missing image: $asset"; exit 1; }
          done

          echo "PriceCheck files and image references OK"

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
