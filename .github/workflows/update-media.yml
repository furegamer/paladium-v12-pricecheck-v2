name: Update Paladium Media

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paladium-media-update
  cancel-in-progress: false

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '(root)'

      - name: Update media feed
        run: python3 scripts/update_media.py

      - name: Commit feed when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-feed.json
          if git diff --cached --quiet; then
            echo "No media changes."
            exit 0
          fi
          git commit -m "chore: refresh Paladium videos and VODs"
          for attempt in 1 2 3; do
            git fetch origin '(root)'
            if git rebase 'origin/(root)'; then
              if git push origin HEAD:'(root)'; then
                echo "Media feed pushed successfully."
                exit 0
              fi
            else
              echo "Rebase conflict detected; rebuilding from the latest root."
              git rebase --abort || true
              git reset --hard 'origin/(root)'
              python3 scripts/update_media.py
              git add media-feed.json
              if git diff --cached --quiet; then
                echo "Media feed is already current after refresh."
                exit 0
              fi
              git commit -m "chore: refresh Paladium videos and VODs"
            fi
            echo "Push race detected, retrying ($attempt/3)..."
            sleep 3
          done
          echo "Unable to push media feed after 3 attempts."
          exit 1
