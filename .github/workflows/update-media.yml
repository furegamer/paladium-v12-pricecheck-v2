name: Update Paladium Media

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: ['(root)']

permissions:
  contents: write

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update media feed
        run: python3 scripts/update_media.py

      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-feed.json
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "chore: refresh Paladium videos and VODs"
            git push
          fi
