<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admins en ligne • PriceCheck</title><style>body{margin:0;background:#080b12;color:#f8fafc;font:15px system-ui}.wrap{max-width:850px;margin:auto;padding:30px 18px}.back{color:#c4b5fd;text-decoration:none}.card{background:#101827;border:1px solid #273449;border-radius:18px;padding:20px;margin-top:16px}.admin{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #273449}.admin:last-child{border:0}.dot{width:11px;height:11px;border-radius:50%;background:#64748b}.online .dot{background:#34d399;box-shadow:0 0 12px #34d399}.muted{color:#94a3b8}.badge{margin-left:auto;padding:5px 9px;border-radius:99px;background:#172033;color:#94a3b8;font-size:12px}.online .badge{background:#064e3b;color:#86efac}</style></head><body><main class="wrap"><a class="back" href="index.html">← PriceCheck</a><h1>🛡️ Équipe administrative</h1><p class="muted">Statut mis à jour automatiquement grâce à Supabase Realtime.</p><section class="card"><div id="list">Chargement…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>const cfg=window.PRICECHECK_AUTH||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const list=document.querySelector('#list');let admins=[];let online=new Map();let channel=null;async function boot(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('config');const r=await sb.from('admins').select('*');if(r.error)throw r.error;admins=r.data||[];render();const session=(await sb.auth.getSession()).data.session;const key=session?.user?.id||crypto.randomUUID();channel=sb.channel('pricecheck-admin-presence',{config:{presence:{key}}});channel.on('presence',{event:'sync'},()=>{const state=channel.presenceState();online=new Map(Object.values(state).flat().map(x=>[x.user_id,x]));render()});channel.subscribe(async status=>{if(status==='SUBSCRIBED'&&session)await channel.track({user_id:session.user.id,at:Date.now()})});setInterval(async()=>{if(session)await channel.track({user_id:session.user.id,at:Date.now()})},15000)}function render(){if(!admins.length){list.innerHTML='<p class="muted">Aucun administrateur enregistré.</p>';return}list.innerHTML=admins.map(a=>{const id=a.user_id||a.id;const is=online.has(id);const label=a.username||a.name||a.email||id.slice(0,8)+'…';return `<div class="admin ${is?'online':''}"><span class="dot"></span><b>${escapeHtml(label)}</b><span class="badge">${is?'🟢 Connecté':'⚪ Hors ligne'}</span></div>`}).join('')}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}boot().catch(e=>list.innerHTML='<p class="muted">Impossible de charger les administrateurs.</p>');</script></body></html>
